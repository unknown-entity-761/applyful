<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Applyful - Application tracker</title>
  <meta name="description" content="Track every job application, portal login and follow-up in one place.">

  <script>
    // Picks light or dark before the page draws, so it never flashes the wrong colors.
    // The choice is saved by js/theme.js under the same key.
    (function () {
      var choice = 'system';
      try { choice = localStorage.getItem('jt-theme') || 'system'; } catch (e) {}
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <!-- Makes it installable and look like an app on phone home screens -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Applyful">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Side menu and list pane: only shown on wide screens (the computer layout) -->
  <nav id="sidenav" class="sidenav" aria-label="Main"></nav>
  <div class="shell-main">
    <div id="banner" class="banner" role="alert" hidden></div>
    <aside id="list-pane" class="list-pane" aria-label="Applications"></aside>
    <div id="view" class="view"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
